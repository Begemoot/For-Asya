<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для моей Аси 💗</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#873b62;background:#fff0f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#ffe4ef,transparent 45%),linear-gradient(155deg,#fff5f9,#ffd8e9);padding:22px 12px}.shell{max-width:530px;margin:auto;border:1px solid #f6bed6;border-radius:28px;background:#fff6fa;box-shadow:0 16px 55px #c9578d25;padding:20px}.top{text-align:center;font-weight:800;font-size:clamp(20px,5vw,26px);margin:4px 0 14px}.cat{display:block;width:210px;max-width:80%;margin:0 auto 10px;filter:drop-shadow(0 8px 10px #e9a4bd55)}.card{background:white;border-radius:25px;padding:24px 20px;box-shadow:0 4px 16px #ecafca35;min-height:260px}h1{text-align:center;font-size:clamp(23px,5.4vw,30px);line-height:1.3;color:#a13d6d;margin:0 0 18px}.message{white-space:pre-line;color:#573348;font-size:17px;line-height:1.65;margin:0 0 18px}.choices{display:grid;gap:11px}.btn{width:100%;border:1px solid #e9a4c2;border-radius:17px;background:#ffe3ee;color:#8c315f;font-size:16px;font-weight:700;padding:14px 12px;cursor:pointer;line-height:1.4}.btn.primary{background:linear-gradient(120deg,#e97eaa,#d95f95);border:0;color:white}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.55;cursor:wait}.nav{display:flex;gap:8px;margin-top:17px}.nav button{flex:1;border:0;background:transparent;color:#996d84;padding:10px;cursor:pointer;font-size:14px}.small{text-align:center;color:#aa718e;font-size:12px;margin:16px 0 0}.error{color:#aa2353;font-size:14px;line-height:1.5}.success{color:#277953}.heart{position:fixed;pointer-events:none;animation:float 3s ease-out forwards;font-size:22px}@keyframes float{to{transform:translateY(-160px) rotate(25deg);opacity:0}}@media(max-width:390px){.shell{padding:14px}.card{padding:20px 14px}.message{font-size:16px}}
</style>
</head>
<body>
<main class="shell"><div class="top">💗 Маленький сайт для моей Аси😘</div>
<svg class="cat" viewBox="0 0 240 190" role="img" aria-label="Милый котик с сердечком"><path d="M47 105 47 29 91 63Q120 50 149 63L194 29V105" fill="#fff" stroke="#d38ca9" stroke-width="5" stroke-linejoin="round"/><path d="m57 43 3 38 29-17zm126 0-3 38-29-17z" fill="#f7b6cb"/><ellipse cx="120" cy="112" rx="83" ry="69" fill="white" stroke="#d38ca9" stroke-width="4"/><ellipse cx="87" cy="115" rx="6" ry="8" fill="#513241"/><ellipse cx="153" cy="115" rx="6" ry="8" fill="#513241"/><ellipse cx="69" cy="134" rx="14" ry="7" fill="#ffd6e4"/><ellipse cx="171" cy="134" rx="14" ry="7" fill="#ffd6e4"/><path d="m113 128 7 5 7-5m-7 5q-8 13-17 2m17-2q8 13 17 2" fill="none" stroke="#513241" stroke-width="3" stroke-linecap="round"/><path d="M120 171 C90 144 63 164 80 185 C95 201 120 217 120 217 C120 217 145 201 160 185 C177 164 150 144 120 171Z" fill="#ee7aa5" stroke="#c95181" stroke-width="4" transform="translate(0 -27)"/><path d="M64 155q-10-13-20-2m132 2q10-13 20-2" fill="none" stroke="#d38ca9" stroke-width="8" stroke-linecap="round"/></svg>
<section class="card" id="content" aria-live="polite"></section><div class="nav"><button id="back" type="button">← Назад</button><button id="reset" type="button">↻ Начать сначала</button></div><p class="small">Сделано с любовью для Аси 💞</p></main>
<script>
'use strict';
// Вставь сюда адрес своей формы Formspree, например https://formspree.io/f/abcdefgh
const FORM_ENDPOINT = 'PASTE_YOUR_FORMSPREE_URL_HERE';
const treats = 'Вкусняшки на 4000 сом (если захочешь больше, то можно и больше, только вот мы уже должны экономить и копить на наше совместное будущее 🥹)';
const answers = {mood:'',becauseOfMe:'',gift:'',bouquetLocation:''};
let page='mood',history=[],sending=false;
const content=document.getElementById('content');
const back=document.getElementById('back');
function go(next){history.push(page);page=next;render();window.scrollTo({top:0,behavior:'smooth'});}
function reset(){page='mood';history=[];sending=false;Object.keys(answers).forEach(k=>answers[k]='');render();}
function addButton(label,fn,primary=false){const b=document.createElement('button');b.type='button';b.className='btn'+(primary?' primary':'');b.textContent=label;b.addEventListener('click',fn);content.querySelector('.choices').appendChild(b);return b;}
function show(title,message='',buttons=[]){content.replaceChildren();const h=document.createElement('h1');h.textContent=title;content.append(h);if(message){const p=document.createElement('p');p.className='message';p.textContent=message;content.append(p);}const choices=document.createElement('div');choices.className='choices';content.append(choices);buttons.forEach(([label,fn,primary])=>addButton(label,fn,primary));back.hidden=history.length===0||sending;}
function setMood(m){answers.mood=m;go(m==='Хорошее'?'good':'bad');}
function chooseGift(g){answers.gift=g;answers.bouquetLocation='';go(g==='Букет'||g==='Всё вместе'?'bouquet':'result');}
function resultText(){let s='';if(answers.gift==='Всё вместе')s+='Ах ты какая, всё при всё забрать хочешь да? 🥰💗\n\n';if(answers.gift==='Букет'||answers.gift==='Всё вместе'){s+=answers.bouquetLocation==='На работу'?'Заказ принят🫡, ожидайте букет в ближайший день😇 и найдите баночку чтоб можно было их положить. 💐':'Заказ принят🫡! Букет доставим домой, а ты найдёшь, куда их поставить 🥹💐';s+='\n\n';}if(answers.gift==='Вкусняшки'||answers.gift==='Всё вместе')s+=treats+' 🍫💗\n\n';if(answers.gift==='Больше разговаривать'||answers.gift==='Всё вместе')s+='Если ты захочешь, я могу как раньше работать в 4 утра, а потом рано ложиться 🥹 Лишь бы тебе стало легче и мы могли побольше времени проводить вместе. ❤️';return s.trim();}
function hearts(){for(let i=0;i<8;i++){const el=document.createElement('span');el.className='heart';el.textContent=i%2?'💗':'💕';el.style.left=(12+i*10)+'%';el.style.top='80%';el.style.animationDelay=(i*.13)+'s';document.body.append(el);setTimeout(()=>el.remove(),4500);}}
function render(){switch(page){
case 'mood':show('Как у тебя настроение? 🥺💗','', [['Хорошее 🥰',()=>{setMood('Хорошее');hearts();},true],['Плохое 😭',()=>setMood('Плохое')],['Пока не знаю 🥹',()=>go('unknown')]]);break;
case 'unknown':show('А теперь уже узнала? 😀💕','', [['Хорошее 🥰',()=>{setMood('Хорошее');hearts();},true],['Плохое 🥺',()=>setMood('Плохое')]]);break;
case 'good':show('КЛАССССНААА 🥹🫶','Я очень очень рад что ты не грустишь, я хочу поскорее с тобой увидеться, да пока что по видеозвонку но даже так видеть тебя это просто как смотреть на самый настоящий комочек счастья 🥹🫶.\n\nЛови миллион виртуальных поцелуйчиков💋💋💋🫰🫰.\n\nИ всё равно хочешь вкусняшек поесть? Или заказать недорогой букет на работу, чтобы ты могла радоваться и дома, и на работе? 💗',[['Выбрать подарочек 🥰',()=>go('gifts'),true]]);break;
case 'bad':show('Блиииин, солнышко моё бедное 😭','Скажи, это из-за меня у тебя плохое настроение? 🥲',[['Да, из-за тебя 🥺',()=>{answers.becauseOfMe='Да';go('sorry');},true],['Нет, не из-за тебя 💗',()=>{answers.becauseOfMe='Нет';go('notme');}]]);break;
case 'sorry':show('Прости пожалуйста 🥺❤️','Скажи, что я могу для тебя сделать, чтобы ты снова общалась со мной как сладкая булочка? 🥺',[['Выбрать 💕',()=>go('gifts'),true]]);break;
case 'notme':show('Хорошо, что хотя бы не я 🥹','Хоть это сделал не я, я хочу чтобы ты снова как самое лучистое солнышко светила! Скажи, что я могу для тебя сделать? 💗',[['Выбрать 💕',()=>go('gifts'),true]]);break;
case 'gifts':show('Чем порадовать мою Асю? 🥹💗','Выбирай, солнышко!',[ [treats+' 🍫',()=>chooseGift('Вкусняшки')],['💐 Красивый букет',()=>chooseGift('Букет')],['💬 Побольше разговаривать',()=>chooseGift('Больше разговаривать')],['💝 Всё вместе!',()=>chooseGift('Всё вместе'),true]]);break;
case 'bouquet':show(answers.gift==='Всё вместе'?'Ах ты какая, всё при всё забрать хочешь да? 🥰':'Куда заказать букет? 💐',answers.gift==='Всё вместе'?'Конечно, солнышко! Всё для тебя 💗 А куда доставить букет?':'Выбирай, где тебе будет приятнее получить цветочки.',[['🏢 На работу',()=>{answers.bouquetLocation='На работу';go('result');},true],['🏠 Домой (куда-нибудь их помещу)',()=>{answers.bouquetLocation='Домой';go('result');}]]);break;
case 'result':show(answers.gift==='Всё вместе'?'Всё для моей булочки 🥰':answers.gift==='Букет'?'Заказ принят 🫡':answers.gift==='Вкусняшки'?'Вкусняшки для моей булочки 🍰':'Побольше времени вместе 🥹',resultText(),[['Последнее послание 💌',()=>go('end'),true]]);break;
case 'end':show('Для моей любимой Аси 🥹💗','Необязательно быть всегда в хорошем настроении, главное запомни что я всегда буду стараться ради того чтобы ты всё-таки всегда была счастлива 🫶.\n\nЛюблю тебя, моё солнышко ☀️💗',[['Отправить ответы моему муженьку🥰',send,true]]);break;
case 'sent':show('Урааа, твой муженёк получил ответы! 🥹💗','Спасибо, моё солнышко! Лови ещё поцелуйчики 💋💋💋',[['Пройти ещё раз 🔄',reset,true]]);break;
}}
async function send(){if(sending)return;const buttons=content.querySelectorAll('button');const msg=document.createElement('p');msg.className='error';if(!/^https:\/\/formspree\.io\/f\/[A-Za-z0-9]+$/.test(FORM_ENDPOINT)){msg.textContent='Отправка ещё не настроена. Попроси муженька подключить Formspree 💌';content.append(msg);return;}sending=true;buttons.forEach(b=>b.disabled=true);back.hidden=true;const payload={_subject:'Ответы Аси 💗', 'Настроение':answers.mood,'Плохое настроение из-за меня':answers.becauseOfMe||'Не спрашивали','Выбранный подарок':answers.gift,'Доставка букета':answers.bouquetLocation||'Не выбрана'};try{const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Не удалось отправить');go('sent');hearts();}catch(e){msg.textContent='Не получилось отправить ответы 😢 Проверь интернет и попробуй ещё раз.';content.append(msg);}finally{sending=false;buttons.forEach(b=>b.disabled=false);back.hidden=history.length===0;}}
back.addEventListener('click',()=>{if(!history.length||sending)return;page=history.pop();render();});document.getElementById('reset').addEventListener('click',()=>{if(sending)return;reset();});render();
</script>
</body>
</html>
